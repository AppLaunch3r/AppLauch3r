<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iOS Launcher</title>

  <!-- PWA Requirements -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <!-- Apple iOS Mobile Requirements -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Launcher">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
      user-select: none; 
      -webkit-tap-highlight-color: transparent;
    }
    
    body, html { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background: #000; 
      color: #fff; 
    }

    /* --- LOCK SCREEN --- */
    #lock-screen {
      position: absolute; 
      inset: 0; 
      background: linear-gradient(135deg, #1c1c1e, #2c2c2e);
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      z-index: 10;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .lock-title {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .passcode-dots { 
      display: flex; 
      gap: 16px; 
      margin-bottom: 40px; 
    }

    .dot { 
      width: 14px; 
      height: 14px; 
      border-radius: 50%; 
      border: 2px solid #fff; 
      transition: background 0.15s ease;
    }

    .dot.filled { 
      background: #fff; 
    }

    .keypad { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 20px; 
    }

    .key {
      width: 75px; 
      height: 75px; 
      border-radius: 50%; 
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 28px; 
      font-weight: 400;
      cursor: pointer; 
    }

    .key:active { 
      background: rgba(255, 255, 255, 0.4); 
    }

    /* --- HOME SCREEN --- */
    #home-screen {
      position: absolute; 
      inset: 0; 
      background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000') center/cover no-repeat;
      display: none; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 20px; 
      padding: 60px 20px; 
      align-content: start;
    }

    .app-icon {
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 8px; 
      cursor: pointer; 
      text-decoration: none; 
      color: #fff;
    }

    .icon-box {
      width: 62px; 
      height: 62px; 
      border-radius: 14px; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      font-weight: 700; 
      font-size: 18px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .app-label { 
      font-size: 11px; 
      font-weight: 500;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8); 
    }

    /* Branding Colors */
    .yt { background: #FF0000; }
    .tt { background: #000000; border: 1px solid rgba(255,255,255,0.2); }
    .x  { background: #000000; border: 1px solid rgba(255,255,255,0.2); }
    .rd { background: #FF4500; }
    .dc { background: #5865F2; }

    /* --- IN-APP OVERLAY WINDOW --- */
    #app-viewer {
      position: absolute;
      inset: 0;
      background: #000;
      display: none;
      flex-direction: column;
      z-index: 20;
    }

    .app-header {
      height: 48px;
      background: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #2c2c2e;
    }

    .back-btn {
      color: #0A84FF;
      font-size: 17px;
      font-weight: 500;
      background: none;
      border: none;
      cursor: pointer;
    }

    #app-title {
      font-size: 15px;
      font-weight: 600;
    }

    iframe {
      width: 100%;
      height: calc(100% - 48px);
      border: none;
      background: #fff;
    }

  </style>
</head>
<body>

  <!-- Lock Screen -->
  <div id="lock-screen">
    <div class="lock-title">Enter Passcode</div>
    <div class="passcode-dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="keypad">
      <div class="key" onclick="pressKey('1')">1</div>
      <div class="key" onclick="pressKey('2')">2</div>
      <div class="key" onclick="pressKey('3')">3</div>
      <div class="key" onclick="pressKey('4')">4</div>
      <div class="key" onclick="pressKey('5')">5</div>
      <div class="key" onclick="pressKey('6')">6</div>
      <div class="key" onclick="pressKey('7')">7</div>
      <div class="key" onclick="pressKey('8')">8</div>
      <div class="key" onclick="pressKey('9')">9</div>
      <div></div>
      <div class="key" onclick="pressKey('0')">0</div>
      <div></div>
    </div>
  </div>

  <!-- Home Screen -->
  <div id="home-screen">
    <div class="app-icon" onclick="openEmbed('https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ', 'YouTube')">
      <div class="icon-box yt">YT</div>
      <span class="app-label">YouTube</span>
    </div>
    <div class="app-icon" onclick="openEmbed('https://www.tiktok.com/embed', 'TikTok')">
      <div class="icon-box tt">TT</div>
      <span class="app-label">TikTok</span>
    </div>
    <div class="app-icon" onclick="openEmbed('https://www.bing.com', 'Web')">
      <div class="icon-box x">X</div>
      <span class="app-label">Web Search</span>
    </div>
    <div class="app-icon" onclick="openEmbed('https://old.reddit.com', 'Reddit')">
      <div class="icon-box rd">RD</div>
      <span class="app-label">Reddit</span>
    </div>
    <div class="app-icon" onclick="openEmbed('https://e.widgetbot.io', 'Discord')">
      <div class="icon-box dc">DC</div>
      <span class="app-label">Discord</span>
    </div>
  </div>

  <!-- In-App Frame Overlay -->
  <div id="app-viewer">
    <div class="app-header">
      <button class="back-btn" onclick="closeEmbed()">‹ Home</button>
      <span id="app-title">App</span>
      <div style="width: 50px;"></div>
    </div>
    <iframe id="web-frame" src=""></iframe>
  </div>

  <script>
    let input = "";
    const pin = "1234";

    function pressKey(num) {
      if (input.length < 4) {
        input += num;
        updateDots();
      }
      
      if (input.length === 4) {
        if (input === pin) {
          const lockScreen = document.getElementById('lock-screen');
          lockScreen.style.opacity = '0';
          lockScreen.style.transform = 'scale(1.1)';
          
          setTimeout(() => {
            lockScreen.style.display = 'none';
            document.getElementById('home-screen').style.display = 'grid';
          }, 300);
        } else {
          setTimeout(() => {
            input = "";
            updateDots();
          }, 250);
        }
      }
    }

    function updateDots() {
      const dots = document.querySelectorAll('.dot');
      dots.forEach((dot, idx) => {
        if (idx < input.length) {
          dot.classList.add('filled');
        } else {
          dot.classList.remove('filled');
        }
      });
    }

    // Embed Frame Controls
    function openEmbed(url, title) {
      document.getElementById('app-title').innerText = title;
      document.getElementById('web-frame').src = url;
      document.getElementById('app-viewer').style.display = 'flex';
    }

    function closeEmbed() {
      document.getElementById('app-viewer').style.display = 'none';
      document.getElementById('web-frame').src = '';
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker Registered!', reg))
          .catch(err => console.error('SW Error:', err));
      });
    }
  </script>
</body>
</html>
